xt x="420.0" y="762.21" font-size="11" text-anchor="middle" fill="#222">Validate</text><text x="420.0" y="775.71" font-size="11" text-anchor="middle" fill="#222">after Each Epoch</text><polyline points="310,765.0 340,765.0" fill="none" stroke="#222" stroke-width="0.9"/><polygon points="340.0,765.0 333.0,762.0 333.0,768.0" fill="#222"/><rect x="530" y="745" width="160" height="40" fill="#fff" stroke="#222" stroke-width="0.9"/><text x="610.0" y="762.21" font-size="11" text-anchor="middle" fill="#222">Keep Best Epoch</text><text x="610.0" y="775.71" font-size="11" text-anchor="middle" fill="#222">(early stopping)</text><polyline points="500,765.0 530,765.0" fill="none" stroke="#222" stroke-width="0.9"/><polygon points="530.0,765.0 523.0,762.0 523.0,768.0" fill="#222"/><polygon points="710,745 779,745 790,756 790,785 710,785" fill="#fff" stroke="#222" stroke-width="0.9"/><polyline points="779,745 779,756 790,756" fill="none" stroke="#222" stroke-width="0.9"/><text x="750.0" y="762.21" font-size="11" text-anchor="middle" fill="#222">Trained</text><text x="750.0" y="775.71" font-size="11" text-anchor="middle" fill="#222">Model</text><polyline points="690,765 710,765" fill="none" stroke="#222" stroke-width="0.9"/><polygon points="710.0,765.0 703.0,762.0 703.0,768.0" fill="#222"/><polyline points="420,785 420,802 230,802 230,785" fill="none" stroke="#222" stroke-width="0.9"/><polygon points="230.0,785.0 227.0,792.0 233.0,792.0" fill="#222"/><rect x="252.0" y="795" width="146.0" height="14" fill="#fff"/><text x="325" y="805.5" font-size="10" text-anchor="middle" fill="#222" font-style="italic">repeat each epoch (up to 50)</text><text x="70" y="851" font-size="12" text-anchor="start" fill="#222" font-weight="700">6  Evaluation and Interpretation</text><rect x="150" y="865" width="180" height="30" fill="#fff" stroke="#222" stroke-width="0.9"/><text x="240.0" y="883.96" font-size="11" text-anchor="middle" fill="#222">Predict Testing Set</text><polyline points="240,895 240,915" 