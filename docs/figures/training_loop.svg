<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 920" width="860" height="920" font-family="Arial, Helvetica, sans-serif"><rect width="860" height="920" fill="#fff"/><polygon points="289.0,15 660.0,15 651.0,60 280.0,60" fill="#fff" stroke="#222" stroke-width="0.9"/><text x="470.0" y="34.71" font-size="11" text-anchor="middle" fill="#222">Training part of one fold</text><text x="470.0" y="48.21" font-size="11" text-anchor="middle" fill="#222">2,058 images with their true labels</text><polyline points="470,60 470,90" fill="none" stroke="#222" stroke-width="0.9"/><polygon points="470.0,90.0 473.0,83.0 467.0,83.0" fill="#222"/><rect x="280.0" y="90" width="380" height="45" fill="#fff" stroke="#222" stroke-width="0.9"/><text x="470.0" y="109.71" font-size="11" text-anchor="middle" fill="#222">Take the next batch of 8 images</text><text x="470.0" y="123.21" font-size="11" text-anchor="middle" fill="#222">(prepared by Module 3)</text><polyline points="470,135 470,160" fill="none" stroke="#222" stroke-width="0.9"/><polygon points="470.0,160.0 473.0,153.0 467.0,153.0" fill="#222"/><rect x="280.0" y="160" width="380" height="50" fill="#fff" stroke="#222" stroke-width="0.9"/><text x="470.0" y="175.46" font-size="11" text-anchor="middle" fill="#222">The model guesses each image:</text><text x="470.0" y="188.96" font-size="11" text-anchor="middle" fill="#222">Normal or Subluxation</text><text x="470.0" y="202.46" font-size="11" text-anchor="middle" fill="#222">(C3, C4 also guess the artifact)</text><polyline points="470,210 470,235" fill="none" stroke="#222" stroke-width="0.9"/><polygon points="470.0,235.0 473.0,228.0 467.0,228.0" fill="#222"/><rect x="280.0" y="235" width="380" height="50" fill="#fff" stroke="#222" stroke-width="0.9"/><text x="470.0" y="250.46" font-size="11" text-anchor="middle" fill="#222">Compare the guesses with the true labels</text><text x="470.0" y="263.96000000000004" font-size="11" text-anchor="middle" fill="#222">Loss = how wrong the guesses are (class-weighted)</text><text x="470.0" y="277.46000000000004" font-size="11" text-anchor="middle" fill="#222">(C3, C4: main loss + 0.3 × artifact loss)</text><polyline points="470,285 470,310" fill="none" stroke="#222" stroke-width="0.9"/><polygon points="470.0,310.0 473.0,303.0 467.0,303.0" fill="#222"/><rect x="280.0" y="310" width="380" height="45" fill="#fff" stroke="#222" stroke-width="0.9"/><text x="470.0" y="329.71" font-size="11" text-anchor="middle" fill="#222">Adam nudges every weight a little</text><text x="470.0" y="343.21" font-size="11" text-anchor="middle" fill="#222">to make the loss smaller</text><polyline points="470,355 470,375" fill="none" stroke="#222" stroke-width="0.9"/><polygon points="470.0,375.0 473.0,368.0 467.0,368.0" fill="#222"/><polygon points="470,375.0 585.0,410 470,445.0 355.0,410" fill="#fff" stroke="#222" stroke-width="0.9"/><text x="470" y="407.21" font-size="11" text-anchor="middle" fill="#222">All 258 batches</text><text x="470" y="420.71" font-size="11" text-anchor="middle" fill="#222">done?</text><polyline points="355,410 240.0,410 240.0,112 280.0,112" fill="none" stroke="#222" stroke-width="0.9"/><polygon points="280.0,112.0 273.0,109.0 273.0,115.0" fill="#222"/><rect x="232.0" y="253" width="16.0" height="14" fill="#fff"/><text x="240.0" y="263.5" font-size="10" text-anchor="middle" fill="#222" font-style="italic">no</text><polyline points="470,445 470,480" fill="none" stroke="#222" stroke-width="0.9"/><polygon points="470.0,480.0 473.0,473.0 467.0,473.0" fill="#222"/><rect x="494.5" y="455" width="101.0" height="14" fill="#fff"/><text x="545" y="465.5" font-size="10" text-anchor="middle" fill="#222" font-style="italic">yes: one epoch done</text><rect x="280.0" y="480" width="380" height="50" fill="#fff" stroke="#222" stroke-width="0.9"/><text x="470.0" y="495.46" font-size="11" text-anchor="middle" fill="#222">Check the model on the validation part</text><text x="470.0" y="508.96" font-size="11" text-anchor="middle" fill="#222">343–344 images, no weight changes</text><text x="470.0" y="522.46" font-size="11" text-anchor="middle" fill="#222">Validation loss</text><polyline points="470,530 470,550" fill="none" stroke="#222" stroke-width="0.9"/><polygon points="470.0,550.0 473.0,543.0 467.0,543.0" fill="#222"/><polygon points="470,550.0 585.0,585 470,620.0 355.0,585" fill="#fff" stroke="#222" stroke-width="0.9"/><text x="470" y="582.21" font-size="11" text-anchor="middle" fill="#222">Lowest validation</text><text x="470" y="595.71" font-size="11" text-anchor="middle" fill="#222">loss so far?</text><polyline points="585,585 725,585 725,620" fill="none" stroke="#222" stroke-width="0.9"/><polygon points="725.0,620.0 728.0,613.0 722.0,613.0" fill="#222"/><rect x="634.5" y="578" width="21.0" height="14" fill="#fff"/><text x="645" y="588.5" font-size="10" text-anchor="middle" fill="#222" font-style="italic">yes</text><polygon points="645,620 794,620 805,631 805,665 645,665" fill="#fff" stroke="#222" stroke-width="0.9"/><polyline points="794,620 794,631 805,631" fill="none" stroke="#222" stroke-width="0.9"/><text x="725.0" y="639.71" font-size="11" text-anchor="middle" fill="#222">Save this model</text><text x="725.0" y="653.21" font-size="11" text-anchor="middle" fill="#222">_best.keras</text><polyline points="470,620 470,690" fill="none" stroke="#222" stroke-width="0.9"/><polygon points="470.0,690.0 473.0,683.0 467.0,683.0" fill="#222"/><rect x="462.0" y="643" width="16.0" height="14" fill="#fff"/><text x="470" y="653.5" font-size="10" text-anchor="middle" fill="#222" font-style="italic">no</text><polyline points="725,665 725,680 470,680" fill="none" stroke="#222" stroke-width="0.9"/><polygon points="470.0,680.0 477.0,683.0 477.0,677.0" fill="#222"/><polygon points="470,690.0 605.0,725 470,760.0 335.0,725" fill="#fff" stroke="#222" stroke-width="0.9"/><text x="470" y="722.21" font-size="11" text-anchor="middle" fill="#222">5 epochs without improvement,</text><text x="470" y="735.71" font-size="11" text-anchor="middle" fill="#222">or 50 epochs done?</text><polyline points="335,725 200.0,725 200.0,75 410,75 410,90" fill="none" stroke="#222" stroke-width="0.9"/><polygon points="410.0,90.0 413.0,83.0 407.0,83.0" fill="#222"/><text x="192.0" y="556" font-size="10" text-anchor="end" fill="#222" font-style="italic">no: next epoch</text><text x="192.0" y="571" font-size="9.5" text-anchor="end" fill="#222" font-style="italic">(reshuffled, new random draws)</text><polyline points="470,760 470,790" fill="none" stroke="#222" stroke-width="0.9"/><polygon points="470.0,790.0 473.0,783.0 467.0,783.0" fill="#222"/><rect x="459.5" y="768" width="21.0" height="14" fill="#fff"/><text x="470" y="778.5" font-size="10" text-anchor="middle" fill="#222" font-style="italic">yes</text><rect x="280.0" y="790" width="380" height="50" fill="#fff" stroke="#222" stroke-width="0.9"/><text x="470.0" y="805.46" font-size="11" text-anchor="middle" fill="#222">Go back to the best epoch&#x27;s weights</text><text x="470.0" y="818.96" font-size="11" text-anchor="middle" fill="#222">(the same weights are saved in _best.keras)</text><text x="470.0" y="832.46" font-size="11" text-anchor="middle" fill="#222">= the trained model, sent to testing (Module 6)</text><text x="20" y="865" font-size="10.5" text-anchor="start" fill="#222">The test images are never used here. If 3 epochs pass without improvement, the learning rate is also divided by 10.</text><text x="20" y="880" font-size="10.5" text-anchor="start" fill="#222">Validation loss: the benchmark watches val_loss; the proposed model watches only its main-head loss, val_tmd_output_loss.</text><text x="20" y="895" font-size="10.5" text-anchor="start" fill="#222">Code: compile_model, model.fit, ModelCheckpoint, EarlyStopping, ReduceLROnPlateau (scripts/pipeline/models.py).</text></svg>